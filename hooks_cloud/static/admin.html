<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hook’s · Administração</title>
<style>
:root{color-scheme:dark;--bg:#0e0e11;--side:#121216;--panel:#17171c;--panel2:#1e1f26;--raised:#262731;--line:#2a2b35;--line2:#3b3d4b;--ink:#ededf2;--muted:#9a9cab;--faint:#6b6d7c;
--accent:#ff4d8d;--accent-ink:#1a050e;--aqua:#2ee6d6;--amber:#f5b83d;--good:#4cd08a;--bad:#ff7a5c;--info:#6cb4ff;--violet:#b7a1ff;font-synthesis:none}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:7px 13px;line-height:1.2}
button:hover:not(:disabled){background:var(--raised)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.danger{color:#ff9b82}button.quiet{background:transparent;border-color:transparent;color:var(--muted)}button.small{padding:4px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{background:#0c0c0f;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}h1{font-size:22px}h2{font-size:17px}h3{font-size:14px;color:var(--muted);font-weight:600}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav .brand{font-weight:800;font-size:17px;padding:2px 10px 14px}nav .brand b{color:var(--accent)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--panel2);color:var(--ink)}nav a[aria-current=page]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 var(--accent)}
nav .count{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:700}
nav .who{margin-top:auto;font-size:12.5px;color:var(--faint);padding:10px;border-top:1px solid var(--line)}
main{padding:24px 28px 60px;max-width:1280px;width:100%}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.kpi .s{color:var(--faint);font-size:12.5px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--faint);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.b-ativa{color:var(--good);border-color:#4cd08a55;background:#4cd08a14}.b-teste{color:var(--info);border-color:#6cb4ff55;background:#6cb4ff14}
.b-atraso{color:var(--amber);border-color:#f5b83d55;background:#f5b83d14}.b-suspensa,.b-expirada{color:var(--bad);border-color:#ff7a5c55;background:#ff7a5c14}
.b-cancelada{color:var(--muted);border-color:var(--line2)}.b-pago{color:var(--good);border-color:#4cd08a55}.b-pendente{color:var(--amber);border-color:#f5b83d55}.b-atrasado,.b-erro{color:var(--bad);border-color:#ff7a5c55}
.b-estornado,.b-cancelado,.b-recusada{color:var(--muted);border-color:var(--line2)}.b-enviado,.b-processado,.b-concluida{color:var(--good);border-color:#4cd08a55}.b-aberta,.b-recebido{color:var(--amber);border-color:#f5b83d55}.b-ignorado{color:var(--muted);border-color:var(--line2)}
.bar{height:7px;border-radius:4px;background:var(--raised);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--aqua)}.bar.warn i{background:var(--amber)}.bar.full i{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{border:1px solid var(--line2);border-left:3px solid var(--amber);background:#f5b83d12;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.notice.bad{border-left-color:var(--bad);background:#ff7a5c12}.notice.good{border-left-color:var(--good);background:#4cd08a12}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(520px,94vw)}dialog::backdrop{background:#000a}
dialog form{padding:20px}dialog h2{margin-bottom:12px}dialog .fields{display:grid;gap:12px}dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}.login h1{margin-bottom:4px}.login .fields{display:grid;gap:12px;margin-top:18px}
pre{white-space:pre-wrap;background:#0c0c0f;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;overflow:auto;max-height:260px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:11px 16px;max-width:420px;z-index:9}.toast.error{border-color:var(--bad)}.toast.hide{display:none}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--raised);border-color:var(--aqua)}
@media(max-width:820px){.shell{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav .who{display:none}.grid2{grid-template-columns:1fr}main{padding:16px}}
</style></head><body>
<div id="app"></div><div id="toast" class="toast hide" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let csrf='',me=null,route={name:'painel',arg:''},cache={};
const brl=c=>'R$ '+((c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=(t,time=false)=>t?new Date(t*1000).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'2-digit',...(time?{hour:'2-digit',minute:'2-digit'}:{})}):'—';
const STATE={teste:'Teste',ativa:'Ativa',atraso:'Em atraso',cancelada:'Cancelada',suspensa:'Suspensa',expirada:'Vencida'};
const badge=(s,txt)=>`<span class="badge b-${esc(s)}">${esc(txt||STATE[s]||s)}</span>`;
const bar=(used,lim)=>{const p=lim?Math.min(100,Math.round(used/lim*100)):0;return `<div class="row" style="gap:8px"><div class="bar ${p>=100?'full':p>=80?'warn':''}" style="flex:1"><i style="width:${p}%"></i></div><span class="small muted" style="min-width:74px;text-align:right">${used.toLocaleString('pt-BR',{maximumFractionDigits:1})} / ${lim.toLocaleString('pt-BR',{maximumFractionDigits:0})}</span></div>`};
function toast(m,err=false){const t=$('toast');t.textContent=m;t.className='toast'+(err?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),6000)}
async function api(path,data){const r=await fetch('/admin/api'+path,{method:data!==undefined?'POST':'GET',headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF':csrf}:{})},body:data!==undefined?JSON.stringify(data):undefined});let v={};try{v=await r.json()}catch(e){}
 if(r.status===401&&me&&path!=='/login'&&v.code==='nao_autorizado'){me=null;csrf='';draw();throw Error('Sessão encerrada. Entre de novo.')}
 if(!r.ok){const e=Error(v.error||'Não foi possível concluir.');e.code=v.code;throw e}return v}
async function run(fn,ok){try{const v=await fn();if(ok)toast(ok);return v}catch(e){toast(e.message,true);throw e}}
function ask(title,fields,submit='Salvar',danger=false){return new Promise(res=>{const d=document.createElement('dialog');
 d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2><div class="fields">${fields.map(f=>`<div><label for="f_${f.name}">${esc(f.label)}</label>${f.type==='select'?`<select id="f_${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value??'')?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea id="f_${f.name}" rows="3">${esc(f.value||'')}</textarea>`:f.type==='note'?`<div class="small muted">${f.html||''}</div>`:`<input id="f_${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.required?'required':''} autocomplete="off">`}${f.help?`<div class="small faint" style="margin-top:3px">${esc(f.help)}</div>`:''}</div>`).join('')}</div><div class="foot"><button type="button" data-x>Cancelar</button><button class="${danger?'danger':'primary'}" value="ok">${esc(submit)}</button></div></form>`;
 document.body.appendChild(d);d.querySelector('[data-x]').onclick=()=>d.close('x');d.addEventListener('close',()=>{const out={};if(d.returnValue==='ok')for(const f of fields)if(f.type!=='note'){const el=d.querySelector('#f_'+f.name);out[f.name]=f.type==='number'?(el.value===''?'':Number(el.value)):el.value}res(d.returnValue==='ok'?out:null);d.remove()});d.showModal();d.querySelector('input,select,textarea')?.focus()})}

/* ───── entrada ───── */
function loginView(){return `<form class="login" id="loginForm"><h1>Hook’s <span style="color:var(--accent)">Administração</span></h1><p class="muted small" style="margin:0">Acesso restrito.</p><div class="fields"><div><label for="lemail">E-mail</label><input id="lemail" type="email" required autocomplete="username"></div><div><label for="lpass">Senha</label><input id="lpass" type="password" required autocomplete="current-password"></div><div id="codeBox" hidden><label for="lcode">Código do aplicativo autenticador</label><input id="lcode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="primary" type="submit">Entrar</button></div></form>`}
document.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();
 try{const v=await api('/login',{email:$('lemail').value,password:$('lpass').value,code:$('lcode').value});csrf=v.csrf;me=v.admin;await draw()}
 catch(err){if(err.code==='totp'){$('codeBox').hidden=false;$('lcode').focus();toast(err.message)}else toast(err.message,true)}});

const NAV=[['painel','Painel'],['clientes','Clientes'],['cobrancas','Cobranças'],['planos','Planos'],['emails','E-mails'],['lgpd','Dados pessoais'],['auditoria','Auditoria'],['webhooks','Webhooks'],['admins','Administradores'],['config','Configurações']];
const ROLE_NAV={dono:null,financeiro:['painel','clientes','cobrancas','planos','emails','auditoria'],suporte:['painel','clientes','emails','lgpd','auditoria']};
async function draw(){
 if(!me){try{const v=await api('/me');me=v;csrf=v.csrf}catch(e){$('app').innerHTML=loginView();return}}
 const allowed=ROLE_NAV[me.role];const nav=NAV.filter(([id])=>!allowed||allowed.includes(id));
 if(route.name!=='cliente'&&!nav.some(([id])=>id===route.name)||route.name==='cliente'&&!nav.some(([id])=>id==='clientes'))route={name:'painel',arg:''};
 $('app').innerHTML=`<div class="shell"><nav aria-label="Seções"><div class="brand">Hook’s <b>admin</b></div>${nav.map(([id,t])=>`<a data-go="${id}" role="link" tabindex="0" ${id===route.name||(id==='clientes'&&route.name==='cliente')?'aria-current="page"':''}>${t}${id==='lgpd'&&cache.metrics?.lgpd_abertos?`<span class="count">${cache.metrics.lgpd_abertos}</span>`:''}</a>`).join('')}<div class="who">${esc(me.name||me.email)}<br><span class="faint">${esc(me.role)}${me.totp?' · 2 etapas':''}</span><br><button class="small quiet" id="meBtn" style="padding:2px 0">Minha segurança</button> <button class="small quiet" id="outBtn" style="padding:2px 0">Sair</button></div></nav><main id="main"><p class="muted">Carregando…</p></main></div>`;
 try{await VIEWS[route.name](route.arg)}catch(e){$('main').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');if(g){route={name:g.dataset.go,arg:g.dataset.arg||''};history.replaceState(null,'','#'+route.name+(route.arg?'/'+route.arg:''));draw();return}
 if(e.target.id==='outBtn'){await api('/logout',{}).catch(()=>{});me=null;csrf='';draw()}
 if(e.target.id==='meBtn')security()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('nav a'))e.target.click()});
const hash=location.hash.slice(1).split('/');if(hash[0]&&hash[0]!=='')route={name:hash[0],arg:hash[1]||''};

async function security(){const f=[{type:'note',name:'n',html:me.totp?'A verificação em duas etapas está ativa.':'Ative a verificação em duas etapas com um aplicativo autenticador (Google Authenticator, Microsoft Authenticator, Authy...).'},
 {name:'old',label:'Senha atual (para trocar a senha)',type:'password'},{name:'new',label:'Nova senha (mínimo 10 caracteres)',type:'password'}];
 const v=await ask('Minha segurança',f,'Trocar senha');if(v&&v.new){await run(()=>api('/password',{old:v.old,new:v.new}),'Senha trocada. Entre de novo.').then(()=>{me=null;draw()}).catch(()=>{})}
 if(!me?.totp){if(confirm('Configurar a verificação em duas etapas agora?')){const t=await run(()=>api('/totp/begin',{}));const c=await ask('Duas etapas',[{type:'note',name:'n',html:`No aplicativo autenticador escolha “inserir chave manualmente” e digite:<br><b style="font-size:16px;letter-spacing:.06em">${esc(t.secret)}</b><br><span class="faint">Conta: ${esc(me.email)} · tipo: baseado em tempo</span>`},{name:'code',label:'Código de 6 dígitos que o aplicativo mostra',required:true}],'Ativar');if(c)await run(()=>api('/totp/confirm',{code:c.code}),'Duas etapas ativadas.').then(()=>{me.totp=true;draw()}).catch(()=>{})}}}

/* ───── telas ───── */
const VIEWS={
async painel(){const m=cache.metrics=await api('/metrics');const e=m.estados;
 const alerts=[];if(m.lgpd_vencidos)alerts.push(`<div class="notice bad"><b>${m.lgpd_vencidos} pedido(s) de dados pessoais fora do prazo de 15 dias.</b> <a data-go="lgpd" style="cursor:pointer;text-decoration:underline">Abrir</a></div>`);
 if(m.webhooks_com_erro)alerts.push(`<div class="notice bad"><b>${m.webhooks_com_erro} aviso(s) de pagamento com erro.</b> Pagamentos podem não ter sido aplicados. <a data-go="webhooks" style="cursor:pointer;text-decoration:underline">Ver</a></div>`);
 if(m.emails_pendentes&&!m.smtp)alerts.push(`<div class="notice"><b>${m.emails_pendentes} e-mail(s) na caixa de saída e o envio automático não está configurado.</b> Configure o SMTP ou envie à mão. <a data-go="emails" style="cursor:pointer;text-decoration:underline">Abrir</a></div>`);
 if(m.provedor==='manual'&&!m.pix_configurado)alerts.push(`<div class="notice"><b>A chave Pix não está configurada.</b> Os clientes recebem “fale com o suporte” no lugar das instruções de pagamento. <a data-go="config" style="cursor:pointer;text-decoration:underline">Configurar</a></div>`);
 if(m.planos_sem_preco.length)alerts.push(`<div class="notice">Planos em rascunho (sem preço, não podem ser vendidos): <b>${esc(m.planos_sem_preco.join(', '))}</b>. <a data-go="planos" style="cursor:pointer;text-decoration:underline">Definir preços</a></div>`);
 const kpi=(t,v,s='')=>`<div class="kpi"><h3>${t}</h3><div class="v">${v}</div><div class="s">${s}</div></div>`;
 const list=(rows,cols)=>rows.length?`<table><tbody>${rows.map(r=>`<tr class="click" data-go="cliente" data-arg="${r.id}">${cols(r)}</tr>`).join('')}</tbody></table>`:'<p class="muted small">Nada por aqui.</p>';
 $('main').innerHTML=`<div class="head"><h1>Painel</h1><button class="small" id="jobsBtn">Rodar tarefas agora</button></div>${alerts.join('')}
 <div class="kpis">${kpi('Receita mensal recorrente',brl(m.mrr_cents),m.pagantes+' pagante(s)')}${kpi('Recebido no mês',brl(m.receita_mes_cents),'pagamentos confirmados')}${kpi('Em teste',e.teste,'')}${kpi('Em atraso',e.atraso,'dentro da tolerância')}${kpi('Vencidas ou suspensas',e.expirada+e.suspensa,'sem acesso a novos usos')}${kpi('Novos (30 dias)',m.novos_30d,m.cancelamentos_30d+' cancelamento(s)')}${kpi('Online agora',m.computadores_online,m.lives_agora+' live(s) ativa(s)')}${kpi('Cobranças pendentes',m.cobrancas_pendentes,'aguardando confirmação')}</div>
 <div class="cols"><div class="box"><h2>Teste acabando (3 dias)</h2>${list(m.teste_acabando,r=>`<td>${esc(r.email)}</td><td class="muted">${dt(r.fim)}</td>`)}</div>
 <div class="box"><h2>Em atraso</h2>${list(m.em_atraso,r=>`<td>${esc(r.email)}</td><td>${esc(r.plano)}</td><td class="muted">venceu ${dt(r.fim)}</td>`)}</div>
 <div class="box"><h2>Perto do limite do plano</h2>${list(m.perto_do_limite,r=>`<td>${esc(r.email)}</td><td>${r.recurso}</td><td>${bar(r.usado,r.limite)}</td>`)}</div></div>`;
 $('jobsBtn').onclick=()=>run(()=>api('/jobs/run',{}),'Tarefas executadas.').then(draw).catch(()=>{})},

async clientes(){const q=cache.q||'',st=cache.st||'',pl=cache.pl||'';const [pls]=await Promise.all([api('/plans')]);
 const v=await api(`/customers?q=${encodeURIComponent(q)}&state=${st}&plan=${pl}&page=${cache.page||1}&size=25`);
 $('main').innerHTML=`<div class="head"><h1>Clientes <span class="muted" style="font-size:15px">${v.total}</span></h1><div class="row"><input id="cq" placeholder="Buscar por nome ou e-mail" value="${esc(q)}" style="width:240px"><select id="cst" style="width:150px"><option value="">Todos os estados</option>${Object.entries(STATE).map(([k,t])=>`<option value="${k}" ${k===st?'selected':''}>${t}</option>`).join('')}</select><select id="cpl" style="width:150px"><option value="">Todos os planos</option>${pls.planos.map(p=>`<option value="${p.code}" ${p.code===pl?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
 <div class="box" style="padding:6px 8px"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Estado</th><th>Vence</th><th style="width:170px">Horas de live</th><th style="width:170px">Clipes</th><th>Últ. pagamento</th></tr></thead><tbody>${v.items.map(c=>`<tr class="click" data-go="cliente" data-arg="${c.id}"><td><b>${esc(c.nome)}</b><br><span class="small muted">${esc(c.email)}</span></td><td>${esc(c.plano_nome)}</td><td>${badge(c.estado)}</td><td>${dt(c.fim)}</td><td>${bar(c.horas,c.horas_lim)}</td><td>${bar(c.clipes,c.clipes_lim)}</td><td class="muted">${c.pagante?dt(c.ultimo_pagamento):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhum cliente com este filtro.</td></tr>'}</tbody></table></div>
 <div class="row"><button class="small" id="pp" ${v.page<=1?'disabled':''}>Anterior</button><span class="muted small">página ${v.page} de ${Math.max(1,Math.ceil(v.total/v.size))}</span><button class="small" id="pn" ${v.page*v.size>=v.total?'disabled':''}>Próxima</button></div>`;
 let timer;$('cq').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{cache.q=e.target.value;cache.page=1;VIEWS.clientes()},300)};$('cst').onchange=e=>{cache.st=e.target.value;cache.page=1;VIEWS.clientes()};$('cpl').onchange=e=>{cache.pl=e.target.value;cache.page=1;VIEWS.clientes()};
 $('pp').onclick=()=>{cache.page=v.page-1;VIEWS.clientes()};$('pn').onclick=()=>{cache.page=v.page+1;VIEWS.clientes()}},

async cliente(id){const c=await api('/customer?id='+id);const pls=(await api('/plans')).planos;const cid=c.id;const act=(path,extra={})=>api(path,{id:cid,...extra});
 const pend=c.pagamentos.filter(p=>p.status==='pendente'&&p.provider==='manual');
 $('main').innerHTML=`<div class="head"><div><a data-go="clientes" class="muted small" style="cursor:pointer">← Clientes</a><h1>${esc(c.nome)} ${badge(c.estado)}</h1><div class="muted">${esc(c.email)}${c.doc?' · '+esc(c.doc):''}${c.telefone?' · '+esc(c.telefone):''}</div></div></div>
 <div class="notice ${c.estado==='ativa'||c.estado==='teste'?'good':c.estado==='atraso'?'':'bad'}">${esc(c.mensagem)}</div>

  reset:async()=>{const v=await run(()=>act('/customer/reset-link'));await ask('Link para criar nova senha',[{type:'note',name:'n',html:`Envie ao cliente (vale por 1 hora, uso único):<br><br><input readonly value="${esc(v.link)}" onclick="this.select()" style="width:100%">`}],'Fechar')},

 $('pst').onchange=e=>{cache.pst=e.target.value;VIEWS.cobrancas()};
 document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{const x=await ask('Confirmar pagamento',[{name:'ref',label:'Referência (opcional)'}],'Confirmar');if(x)run(()=>api('/customer/confirm-charge',{payment:b.dataset.confirm,ref:x.ref}),'Pagamento confirmado.').then(()=>VIEWS.cobrancas()).catch(()=>{})})},

async planos(){const v=await api('/plans');
 $('main').innerHTML=`<div class="head"><h1>Planos</h1>${me.role==='dono'?'<button class="primary" id="newPlan">Novo plano</button>':''}</div><div class="notice">Os números dos planos de partida são <b>ilustrativos</b>. Defina limites e preços a partir do custo real e ative o plano para poder vender. Mudar um plano vale para todos os clientes dele no próximo sincronismo do programa.</div><div class="box" style="padding:6px 8px"><table><thead><tr><th>Plano</th><th>Preço/mês</th><th>Lives</th><th>Horas/mês</th><th>Clipes/mês</th><th>Canais</th><th>PCs</th><th>Estado</th><th></th></tr></thead><tbody>${v.planos.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="small faint">${esc(p.code)}</span></td><td>${p.trial?'grátis':p.price_cents?brl(p.price_cents):'<span class="muted">sem preço</span>'}</td><td>${p.max_lives}</td><td>${p.hours_month}</td><td>${p.clips_month}</td><td>${p.max_streamers}</td><td>${p.max_devices}</td><td>${p.active?badge('ativa','ativo'):badge('cancelada','rascunho')}</td><td>${me.role==='dono'?`<button class="small" data-edit="${p.code}">Editar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
 const edit=async p=>{const v2=await ask(p?'Editar plano '+p.name:'Novo plano',[{name:'code',label:'Código (letras e números)',value:p?.code||'',required:true},{name:'name',label:'Nome',value:p?.name||'',required:true},{name:'price',label:'Preço mensal (R$)',type:'number',step:'0.01',value:p?p.price_cents/100:'',min:0},{name:'max_lives',label:'Lives simultâneas (1 a 5)',type:'number',value:p?.max_lives??1,required:true},{name:'hours_month',label:'Horas de live por mês',type:'number',value:p?.hours_month??40,required:true},{name:'clips_month',label:'Clipes exportados por mês',type:'number',value:p?.clips_month??60,required:true},{name:'max_streamers',label:'Canais (streamers)',type:'number',value:p?.max_streamers??1,required:true},{name:'max_devices',label:'Computadores',type:'number',value:p?.max_devices??1,required:true},{name:'description',label:'Descrição',value:p?.description||''},{name:'active',label:'Disponível para assinar',type:'select',options:[['1','Sim'],['','Não (rascunho)']],value:p?.active?'1':''}],'Salvar');
  if(v2)await run(()=>api('/plan/save',{code:v2.code,name:v2.name,price_cents:Math.round((v2.price||0)*100),max_lives:v2.max_lives,hours_month:v2.hours_month,clips_month:v2.clips_month,max_streamers:v2.max_streamers,max_devices:v2.max_devices,description:v2.description,active:!!v2.active,public:p?!!p.public:true,sort:p?.sort||9}),'Plano salvo.').then(()=>VIEWS.planos()).catch(()=>{})};
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(v.planos.find(x=>x.code===b.dataset.edit)));if($('newPlan'))$('newPlan').onclick=()=>edit(null)},

async emails(){const v=await api('/outbox');

 $('newAdm').onclick=async()=>{const x=await ask('Novo administrador',[{name:'email',label:'E-mail',type:'email',required:true},{name:'name',label:'Nome',required:true},{name:'role',label:'Papel',type:'select',options:[['suporte','Suporte'],['financeiro','Financeiro'],['dono','Dono']]},{name:'password',label:'Senha inicial (mínimo 10 caracteres)',type:'password',required:true}],'Criar');if(x)run(()=>api('/admins/create',x),'Administrador criado.').then(()=>VIEWS.admins()).catch(()=>{})};
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>run(()=>api('/admins/set',{id:b.dataset.act,active:!!b.dataset.on}),'Atualizado.').then(()=>VIEWS.admins()).catch(()=>{}));
 document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{const x=await ask('Nova senha (desliga as 2 etapas)',[{name:'password',label:'Nova senha',type:'password',required:true}],'Trocar');if(x)run(()=>api('/admins/set',{id:b.dataset.pw,password:x.password}),'Senha trocada.').catch(()=>{})})},

async config(){const v=await api('/settings');const c=v.config;
 const f=(k,l,t='text',h='')=>`<div><label for="s_${k}">${l}</label>${t==='bool'?`<select id="s_${k}"><option value="1" ${c[k]?'selected':''}>Sim</option><option value="" ${c[k]?'':'selected'}>Não</option></select>`:t==='prov'?`<select id="s_${k}"><option value="manual" ${c[k]==='manual'?'selected':''}>Manual (Pix pela chave, você confirma)</option><option value="asaas" ${c[k]==='asaas'?'selected':''}>Asaas (automático)</option></select>`:`<input id="s_${k}" type="${t}" value="${esc(c[k])}">`}${h?`<div class="small faint" style="margin-top:3px">${h}</div>`:''}</div>`;
 $('main').innerHTML=`<div class="head"><h1>Configurações</h1><div class="row"><button id="bk">Fazer backup do banco</button></div></div>
 <div class="cols"><div class="box"><h2>Estado da instalação</h2><p>${v.smtp?badge('ativa','e-mail automático ligado'):badge('atraso','e-mail automático desligado')} <span class="small muted">variáveis HOOKS_SMTP_*</span></p><p>${v.asaas?badge('ativa','Asaas configurado'):badge('cancelada','Asaas não configurado')} ${v.webhook?badge('ativa','webhook com token'):badge('cancelada','webhook sem token')} <span class="small muted">HOOKS_ASAAS_KEY, HOOKS_ASAAS_WEBHOOK_TOKEN</span></p><label>Chave pública das licenças (vai no programa do cliente)</label><pre>${esc(JSON.stringify({kid:v.kid,public_keys:{[v.kid]:v.chave_publica}},null,2))}</pre></div>
 <div class="box"><h2>Cobrança</h2><div class="fields" style="display:grid;gap:12px">${f('billing_provider','Como cobrar','prov','No modo Asaas o cliente recebe a cobrança e o pagamento libera a assinatura sozinho.')}${f('pix_key','Chave Pix (modo manual)')}${f('pix_name','Nome do recebedor')}${f('trial_days','Dias de teste','number')}${f('grace_days','Dias de tolerância após vencer','number','Dentro da tolerância o cliente usa normalmente, com aviso.')}</div></div></div>
 <div class="box"><h2>Geral</h2><div class="grid2">${f('public_url','Endereço público do servidor','text','Usado nos links dos e-mails. Com https:// ativa cookies seguros e HSTS.')}${f('support_email','E-mail de suporte','email')}${f('download_url','Link para baixar o programa')}${f('signup_open','Cadastros abertos','bool')}${f('token_ttl_hours','Validade da licença offline (horas)','number','Sem internet, o programa funciona até aqui.')}${f('session_hours','Sessão do cliente (horas)','number')}${f('admin_session_hours','Sessão do admin (horas)','number')}${f('renewal_reminder_days','Aviso de renovação (dias antes)','number')}${f('trial_reminder_days','Aviso do fim do teste (dias antes)','number')}${f('terms_version','Versão dos Termos','text','Mude quando alterar os termos.')}${f('privacy_version','Versão da Privacidade')}${f('trust_proxy','Confiar no cabeçalho do proxy (X-Forwarded-For)','bool','Ligue só atrás de um proxy seu.')}</div><div class="row" style="margin-top:16px"><button class="primary" id="saveCfg">Salvar</button></div></div>`;
 $('saveCfg').onclick=()=>{const d={};for(const k of Object.keys(c)){const el=$('s_'+k);if(!el)continue;d[k]=el.tagName==='SELECT'&&['signup_open','trust_proxy'].includes(k)?!!el.value:el.type==='number'?Number(el.value):el.value}run(()=>api('/settings/save',d),'Configurações salvas.').catch(()=>{})};
 $('bk').onclick=()=>run(()=>api('/backup',{})).then(r=>toast('Backup criado: '+r.arquivo)).catch(()=>{})}};
draw();
</script></body></html>
